spring:
  application:
    name: rohilla-crm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET:8f8a7e6d5c4b3a2110099887766554433221100aabbccddeeff00112233445566}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  storage:
    upload-dir: ${STORAGE_BASE_PATH:./uploads}
  rate-limit:
    login-capacity: 5
    login-tokens-per-minute: 5

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.rohilla.crm: DEBUG
    org.springframework.security: INFO
