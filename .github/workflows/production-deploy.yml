name: Production Build, Test & Hostinger Deployment

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Verification (Spring Boot, Argon2id, RBAC, Unit & Security Tests)
  # ----------------------------------------------------------------------------
  test-backend:
    name: Backend Tests (Maven & Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: |
          cd backend
          mvn clean test --batch-mode

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Verification (Vite & TypeScript Zero-Error Check)
  # ----------------------------------------------------------------------------
  test-frontend:
    name: Frontend Build (Node.js & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Build Verification
  # ----------------------------------------------------------------------------
  docker-check:
    name: Docker Images Build Verification
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: rohilla-crm-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: rohilla-crm-frontend:latest

  # ----------------------------------------------------------------------------
  # Job 4: Optional Legacy VPS Deploy (Triggered only if VPS secret is configured)
  # ----------------------------------------------------------------------------
  deploy-hostinger-vps:
    name: Optional Deploy to Hostinger VPS
    needs: [docker-check]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.HOSTINGER_VPS_IP != ''
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            cd /opt/rohilla-crm
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af
